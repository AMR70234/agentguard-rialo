<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgentGuard · Reputation</title>
<link rel="icon" type="image/png" href="/rialo-mark.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D10; --panel:#14181D; --border:#232830; --text:#E8EAED;
    --muted:#8B93A0; --blue:#2DD4BF; --green:#22C55E; --red:#EF4444;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;margin:0;padding:40px 24px;}
  .wrap{max-width:900px;margin:0 auto;}
  nav{display:flex;gap:18px;margin-bottom:28px;font-family:'JetBrains Mono',monospace;font-size:12px;flex-wrap:wrap;}
  nav a{color:var(--muted);text-decoration:none;}
  nav a.active{color:var(--text);}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--blue);letter-spacing:.08em;margin-bottom:10px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:32px;margin:0 0 12px;}
  .sub{color:var(--muted);font-size:14.5px;margin-bottom:28px;}
  .wallet-line{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:24px;}
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px;}
  .stat-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .stat-card .label{font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;}
  .stat-card .value{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;}
  .bar-wrap{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;}
  .bar-wrap .label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;}
  .bar-track{width:100%;height:10px;background:#191E24;border-radius:100px;overflow:hidden;display:flex;}
  .bar-fill-accepted{background:var(--green);height:100%;}
  .bar-fill-rejected{background:var(--red);height:100%;}
  .legend{display:flex;gap:20px;margin-top:12px;font-size:12px;color:var(--muted);}
  .legend span{display:flex;align-items:center;gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;}
  .note{font-size:12.5px;color:var(--muted);margin-top:24px;line-height:1.6;}

  .wrap{padding-left:calc(190px + 40px) !important;}
  .sidebar{position:fixed;top:0;left:0;width:190px;height:100vh;background:var(--panel);border-right:1px solid var(--border);padding:24px 14px;overflow-y:auto;}
  .sidebar-brand{display:flex;align-items:center;gap:8px;margin-bottom:28px;padding:0 10px;}
  .sidebar-brand img{width:50px;height:50px;border-radius:10px;}
  .sidebar-brand span{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;color:var(--text);}
  .sidebar-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:12.5px;margin-bottom:2px;}
  .sidebar-link i{font-size:17px;}
  .sidebar-link:hover{background:var(--panel-2);color:var(--text);}
  .sidebar-link.active{background:rgba(45,212,191,0.15);color:var(--blue);}
</style>
</head>
<body>
<div class="wrap">
  <div class="sidebar">
    <div class="sidebar-brand"><img src="/favicon.png" alt="AgentGuard" /><span>AgentGuard</span></div>
    <a href="/" class="sidebar-link"><i class="ti ti-home"></i>Home</a>
    <a href="/my-wallet.html" class="sidebar-link"><i class="ti ti-wallet"></i>My Wallet</a>
    <a href="/security.html" class="sidebar-link"><i class="ti ti-shield-lock"></i>Security</a>
    <a href="/transactions.html" class="sidebar-link"><i class="ti ti-list-details"></i>Transactions</a>
    <a href="/reputation.html" class="sidebar-link active"><i class="ti ti-star"></i>Reputation</a>
    <a href="/faq.html" class="sidebar-link"><i class="ti ti-help-circle"></i>FAQ</a>
    <a href="/compare.html" class="sidebar-link"><i class="ti ti-scale"></i>Compare</a>
  </div>

  <div class="eyebrow">TRACK RECORD, TIED TO A WALLET</div>
  <h1>Worker reputation</h1>
  <p class="sub">Every completed job updates this worker's record, keyed by wallet address and stored persistently — not a session counter that resets on redeploy.</p>

  <div id="repContainer"><div class="sub">Loading...</div></div>
</div>

<script>
async function loadReputation() {
  const container = document.getElementById('repContainer');
  try {
    const res = await fetch('/reputation');
    const stats = await res.json();
    const rejected = stats.totalJobs - stats.accepted;
    const acceptedPct = stats.totalJobs > 0 ? (stats.accepted / stats.totalJobs * 100) : 0;
    const rejectedPct = 100 - acceptedPct;

    container.innerHTML = `
      <div class="wallet-line"><i class="ti ti-wallet" style="vertical-align:-2px;margin-right:6px;"></i>Worker wallet: 0x690b1399d41bbc1d48ed77527e84d88da4e02cd4</div>
      <div class="stats-row">
        <div class="stat-card"><div class="label">Total jobs</div><div class="value">${stats.totalJobs}</div></div>
        <div class="stat-card"><div class="label">Accepted</div><div class="value" style="color:var(--green);">${stats.accepted}</div></div>
        <div class="stat-card"><div class="label">Rejected</div><div class="value" style="color:var(--red);">${rejected}</div></div>
        <div class="stat-card"><div class="label">Acceptance rate</div><div class="value">${stats.acceptanceRate}%</div></div>
      </div>
      <div class="bar-wrap">
        <div class="label">Accepted vs rejected</div>
        <div class="bar-track">
          <div class="bar-fill-accepted" style="width:${acceptedPct}%;"></div>
          <div class="bar-fill-rejected" style="width:${rejectedPct}%;"></div>
        </div>
        <div class="legend">
          <span><span class="dot" style="background:var(--green);"></span>Accepted (${stats.accepted})</span>
          <span><span class="dot" style="background:var(--red);"></span>Rejected (${rejected})</span>
        </div>
      </div>
      <p class="note">Reputation is persisted in a local SQLite database, keyed by wallet address. If AgentGuard ever supports multiple worker agents, each one builds an independent, portable track record instead of sharing one pool.</p>
    `;
  } catch (e) {
    container.innerHTML = '<div class="sub">Could not load reputation data.</div>';
  }
}
loadReputation();
loadClientHistory();

async function loadClientHistory() {
  try {
    const userRes = await fetch('/auth/me');
    const user = await userRes.json();
    if (!user) return;

    const txRes = await fetch('/transactions');
    const txRows = await txRes.json();
    const total = txRows.length;
    const released = txRows.filter(r => r.status === 'released').length;
    const refunded = total - released;
    const rate = total > 0 ? Math.round((released / total) * 100) : 0;

    const section = document.createElement('div');
    section.style.marginTop = '36px';
    section.innerHTML = `
      <div class="eyebrow">YOUR RECORD, AS A CLIENT</div>
      <h2 style="font-size:20px;margin:0 0 6px;">${user.email}</h2>
      <p class="sub">Jobs you've submitted with your own wallet, since signing in.</p>
      <div class="stats-row">
        <div class="stat-card"><div class="label">Jobs submitted</div><div class="value">${total}</div></div>
        <div class="stat-card"><div class="label">Released</div><div class="value" style="color:var(--green);">${released}</div></div>
        <div class="stat-card"><div class="label">Refunded</div><div class="value" style="color:var(--red);">${refunded}</div></div>
        <div class="stat-card"><div class="label">Success rate</div><div class="value">${rate}%</div></div>
      </div>
    `;
    document.querySelector('.wrap').appendChild(section);
  } catch (e) {}
}
</script>
</body>
</html>
